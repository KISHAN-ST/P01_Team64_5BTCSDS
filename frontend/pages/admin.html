<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Dashboard — ShopVerse</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@600;700;800&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="../assets/css/tokens.css" rel="stylesheet">
  <link href="../assets/css/main.css" rel="stylesheet">
</head>
<body>

<div id="sv-header"></div>

<div class="sv-shell">
  <nav class="sv-side" aria-label="Admin navigation">
    <a href="#dashboard" data-view="dashboard" class="active"><i class="bi bi-speedometer2"></i> Dashboard</a>
    <a href="#users" data-view="users"><i class="bi bi-people"></i> Users</a>
    <a href="#orders" data-view="orders"><i class="bi bi-receipt"></i> Orders</a>
    <a href="#categories" data-view="categories"><i class="bi bi-diagram-3"></i> Categories</a>
    <a href="#coupons" data-view="coupons"><i class="bi bi-ticket-perforated"></i> Coupons</a>
    <a href="#reports" data-view="reports"><i class="bi bi-bar-chart"></i> Reports</a>
  </nav>

  <main class="sv-main">
    <div id="view"></div>
  </main>
</div>

<!-- Coupon editor -->
<div class="modal fade" id="couponModal" tabindex="-1" aria-hidden="true">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content" style="border-radius:var(--r-lg)">
      <div class="modal-header border-0">
        <h5 class="modal-title">Create coupon</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
      </div>
      <div class="modal-body">
        <form id="couponForm">
          <div class="row g-3">
            <div class="col-md-6 field mb-0">
              <label for="cCode">Code</label>
              <input class="input" id="cCode" required style="text-transform:uppercase" placeholder="WELCOME10">
            </div>
            <div class="col-md-6 field mb-0">
              <label for="cType">Type</label>
              <select class="select" id="cType">
                <option value="percentage">Percentage (%)</option>
                <option value="flat">Flat amount (₹)</option>
              </select>
            </div>
            <div class="col-md-6 field mb-0">
              <label for="cValue">Value</label>
              <input class="input" id="cValue" type="number" min="1" required>
            </div>
            <div class="col-md-6 field mb-0">
              <label for="cMax">Max discount (₹)</label>
              <input class="input" id="cMax" type="number" min="0" placeholder="0 = no cap">
            </div>
            <div class="col-md-6 field mb-0">
              <label for="cMin">Minimum order (₹)</label>
              <input class="input" id="cMin" type="number" min="0" value="0">
            </div>
            <div class="col-md-6 field mb-0">
              <label for="cExp">Expires on</label>
              <input class="input" id="cExp" type="date" required>
            </div>
            <div class="col-12 field mb-0">
              <label for="cDesc">Description</label>
              <input class="input" id="cDesc" placeholder="10% off orders above ₹500">
            </div>
          </div>
          <button class="btn-sv btn-primary-sv btn-block mt-4" type="submit">Create coupon</button>
        </form>
      </div>
    </div>
  </div>
</div>

<!-- Category editor -->
<div class="modal fade" id="catModal" tabindex="-1" aria-hidden="true">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content" style="border-radius:var(--r-lg)">
      <div class="modal-header border-0">
        <h5 class="modal-title">Add category</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
      </div>
      <div class="modal-body">
        <form id="catForm">
          <div class="field">
            <label for="catName">Name</label>
            <input class="input" id="catName" required>
          </div>
          <div class="field">
            <label for="catParent">Parent category</label>
            <select class="select" id="catParent">
              <option value="">None (top-level)</option>
            </select>
          </div>
          <div class="field">
            <label for="catIcon">Icon class</label>
            <input class="input" id="catIcon" value="bi-tag" placeholder="bi-laptop">
            <span class="field-hint">Any Bootstrap Icons class name.</span>
          </div>
          <button class="btn-sv btn-primary-sv btn-block mt-3" type="submit">Save category</button>
        </form>
      </div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<script src="../assets/js/api.js"></script>
<script src="../assets/js/ui.js"></script>
<script>
(async function () {
  UI.mountLayout({ withFooter: false });
  if (!UI.requireAuth('admin')) return;

  const view = document.getElementById('view');
  const charts = {};
  let couponModal, catModal;

  const routes = { dashboard, users, orders, categories, coupons, reports };

  function go(name) {
    document.querySelectorAll('.sv-side a').forEach((a) =>
      a.classList.toggle('active', a.dataset.view === name)
    );
    Object.values(charts).forEach((c) => c?.destroy());
    (routes[name] || dashboard)();
  }

  document.querySelectorAll('.sv-side a').forEach((a) =>
    a.addEventListener('click', (e) => {
      e.preventDefault();
      location.hash = a.dataset.view;
      go(a.dataset.view);
    })
  );

  const trend = (n) => {
    const cls = n > 0 ? 'up' : n < 0 ? 'down' : 'flat';
    const icon = n > 0 ? 'bi-arrow-up-right' : n < 0 ? 'bi-arrow-down-right' : 'bi-dash';
    return `<span class="trend ${cls}"><i class="bi ${icon}"></i>${Math.abs(n)}% vs previous period</span>`;
  };

  const kpi = (icon, bg, color, value, label, trendPct) => `
    <div class="kpi">
      <div class="ico" style="background:${bg};color:${color}"><i class="bi ${icon}"></i></div>
      <div class="val">${value}</div>
      <div class="lbl">${label}</div>
      ${trendPct !== undefined ? trend(trendPct) : ''}
    </div>`;

  /* ------------------------------- dashboard ----------------------------- */

  async function dashboard() {
    view.innerHTML = `
      <div class="d-flex flex-wrap justify-content-between align-items-center gap-3 mb-4">
        <div>
          <h1 style="font-size:var(--t-xl);margin:0">Admin Dashboard</h1>
          <p class="muted mb-0" style="font-size:var(--t-sm)">Overview of your platform.</p>
        </div>
        <select class="select" id="range" style="width:auto">
          <option value="7">Last 7 days</option>
          <option value="30" selected>Last 30 days</option>
          <option value="90">Last 90 days</option>
        </select>
      </div>

      <div class="row g-3 mb-4" id="kpis">
        ${'<div class="col-6 col-lg-3"><div class="kpi"><div class="sk sk-text" style="height:70px"></div></div></div>'.repeat(4)}
      </div>

      <div class="row g-3">
        <div class="col-lg-7">
          <div class="sv-card sv-card-pad">
            <h2 style="font-size:var(--t-md)" class="mb-3">Sales analytics</h2>
            <canvas id="salesChart" height="120"></canvas>
          </div>
        </div>
        <div class="col-lg-5">
          <div class="sv-card sv-card-pad">
            <h2 style="font-size:var(--t-md)" class="mb-3">User growth</h2>
            <canvas id="growthChart" height="150"></canvas>
          </div>
        </div>
        <div class="col-lg-7">
          <div class="sv-card sv-card-pad">
            <h2 style="font-size:var(--t-md)" class="mb-3">Top products</h2>
            <div class="table-scroll"><table class="tbl">
              <thead><tr><th>Product</th><th>Units sold</th><th>Revenue</th><th>Stock</th></tr></thead>
              <tbody id="topRows">${UI.skeletonRows(5, 4)}</tbody>
            </table></div>
          </div>
        </div>
        <div class="col-lg-5">
          <div class="sv-card sv-card-pad">
            <h2 style="font-size:var(--t-md)" class="mb-3">Orders by status</h2>
            <canvas id="statusChart" height="180"></canvas>
          </div>
        </div>
      </div>`;

    document.getElementById('range').addEventListener('change', (e) => loadAll(Number(e.target.value)));
    loadAll(30);
  }

  async function loadAll(days) {
    try {
      const [d, sales, growth, top] = await Promise.all([
        SV.api.admin.dashboard(days),
        SV.api.admin.salesReport({ days }),
        SV.api.admin.userGrowth({ days: Math.max(days, 30) }),
        SV.api.admin.topProducts({ limit: 8 }),
      ]);

      const k = d.data;
      document.getElementById('kpis').innerHTML = `
        <div class="col-6 col-lg-3">${kpi('bi-people-fill', 'var(--info-bg)', 'var(--info)', k.totalUsers, `Total Users (+${k.newUsers} new)`)}</div>
        <div class="col-6 col-lg-3">${kpi('bi-receipt', 'var(--brand-50)', 'var(--brand-700)', k.totalOrders, 'Total Orders', k.periodOrdersTrend)}</div>
        <div class="col-6 col-lg-3">${kpi('bi-currency-rupee', 'var(--success-bg)', 'var(--success)', UI.money(k.totalSales), 'Sales in period', k.totalSalesTrend)}</div>
        <div class="col-6 col-lg-3">${kpi('bi-star-fill', 'var(--warning-bg)', 'var(--accent-amber)', k.averageRating || '—', `Avg. Rating (${k.totalReviews} reviews)`)}</div>`;

      drawSales(sales.data);
      drawGrowth(growth.data);
      drawStatus(k.ordersByStatus);
      fillTop(top.data);
    } catch (err) {
      document.getElementById('kpis').innerHTML =
        `<div class="col-12">${UI.empty('bi-plug', 'Could not load reports', err.message)}</div>`;
    }
  }

  function drawSales(series) {
    const el = document.getElementById('salesChart');
    if (!el) return;
    charts.sales?.destroy();
    charts.sales = new Chart(el, {
      type: 'bar',
      data: {
        labels: series.map((d) =>
          new Date(d.period).toLocaleDateString('en-IN', { day: 'numeric', month: 'short' })
        ),
        datasets: [{
          label: 'Revenue',
          data: series.map((d) => d.revenue),
          backgroundColor: '#2d6a4f',
          borderRadius: 4,
          maxBarThickness: 22,
        }],
      },
      options: {
        responsive: true,
        plugins: {
          legend: { display: false },
          tooltip: { callbacks: { label: (c) => `₹${Number(c.parsed.y).toLocaleString('en-IN')}` } },
        },
        scales: {
          y: { beginAtZero: true, ticks: { callback: (v) => `₹${v >= 1000 ? `${v / 1000}k` : v}` }, grid: { color: 'rgba(128,128,128,.12)' } },
          x: { grid: { display: false }, ticks: { maxTicksLimit: 10 } },
        },
      },
    });
  }

  function drawGrowth(series) {
    const el = document.getElementById('growthChart');
    if (!el) return;
    charts.growth?.destroy();
    charts.growth = new Chart(el, {
      type: 'line',
      data: {
        labels: series.map((d) =>
          new Date(d.date).toLocaleDateString('en-IN', { day: 'numeric', month: 'short' })
        ),
        datasets: [
          {
            label: 'Total users',
            data: series.map((d) => d.cumulative),
            borderColor: '#1565c0',
            backgroundColor: 'rgba(21,101,192,.12)',
            fill: true,
            tension: 0.35,
            pointRadius: 0,
            borderWidth: 2,
          },
          {
            label: 'New signups',
            data: series.map((d) => d.newUsers),
            borderColor: '#f0a202',
            tension: 0.35,
            pointRadius: 0,
            borderWidth: 2,
          },
        ],
      },
      options: {
        responsive: true,
        plugins: { legend: { position: 'bottom', labels: { boxWidth: 10, font: { size: 11 } } } },
        scales: {
          y: { beginAtZero: true, grid: { color: 'rgba(128,128,128,.12)' } },
          x: { grid: { display: false }, ticks: { maxTicksLimit: 6 } },
        },
      },
    });
  }

  function drawStatus(byStatus) {
    const el = document.getElementById('statusChart');
    if (!el) return;
    charts.status?.destroy();
    const labels = Object.keys(byStatus);
    charts.status = new Chart(el, {
      type: 'doughnut',
      data: {
        labels,
        datasets: [{
          data: labels.map((l) => byStatus[l]),
          backgroundColor: ['#1565c0', '#2d6a4f', '#ed8936', '#2e7d32', '#c62828'],
          borderWidth: 0,
        }],
      },
      options: {
        responsive: true,
        cutout: '62%',
        plugins: { legend: { position: 'bottom', labels: { boxWidth: 10, font: { size: 11 } } } },
      },
    });
  }

  function fillTop(rows) {
    const host = document.getElementById('topRows');
    if (!host) return;
    host.innerHTML = rows.length
      ? rows.map((p) => `
          <tr>
            <td>
              <div class="d-flex align-items-center gap-2">
                <img src="${UI.esc(p.image || '')}" alt="" style="width:34px;height:34px;object-fit:cover;border-radius:var(--r-sm)">
                <strong class="text-truncate d-block" style="max-width:230px">${UI.esc(p.name)}</strong>
              </div>
            </td>
            <td class="num"><strong>${p.unitsSold}</strong></td>
            <td class="price">${UI.money(p.revenue)}</td>
            <td><span class="${p.stock === 0 ? 'stock-out' : p.stock <= 10 ? 'stock-warn' : 'stock-ok'} num">${p.stock}</span></td>
          </tr>`).join('')
      : '<tr><td colspan="4" class="text-center dim py-4">No sales recorded yet.</td></tr>';
  }

  /* --------------------------------- users ------------------------------- */

  async function users() {
    view.innerHTML = `
      <h1 style="font-size:var(--t-xl)" class="mb-1">Users</h1>
      <p class="muted" style="font-size:var(--t-sm)">Everyone registered on the platform.</p>
      <div class="d-flex flex-wrap gap-2 my-4">
        <input class="input" id="uSearch" placeholder="Search by name or email…" style="width:260px">
        <select class="select" id="uRole" style="width:auto">
          <option value="">All roles</option>
          <option value="customer">Customers</option>
          <option value="seller">Sellers</option>
          <option value="admin">Admins</option>
        </select>
      </div>
      <div class="sv-card sv-card-pad">
        <div class="table-scroll"><table class="tbl">
          <thead><tr><th>User</th><th>Role</th><th>Joined</th><th>Status</th><th></th></tr></thead>
          <tbody id="userRows">${UI.skeletonRows(8, 5)}</tbody>
        </table></div>
      </div>`;

    let timer;
    document.getElementById('uSearch').addEventListener('input', () => {
      clearTimeout(timer);
      timer = setTimeout(loadUsers, 300);
    });
    document.getElementById('uRole').addEventListener('change', loadUsers);
    loadUsers();
  }

  async function loadUsers() {
    const host = document.getElementById('userRows');
    if (!host) return;
    try {
      const { data } = await SV.api.admin.users({
        search: document.getElementById('uSearch').value || undefined,
        role: document.getElementById('uRole').value || undefined,
        limit: 100,
      });

      host.innerHTML = data.length
        ? data.map((u) => `
            <tr>
              <td>
                <div class="d-flex align-items-center gap-2">
                  <span class="d-grid" style="width:34px;height:34px;border-radius:var(--r-full);background:var(--brand-50);color:var(--brand-700);place-items:center;font-weight:700">
                    ${UI.esc(u.name[0].toUpperCase())}
                  </span>
                  <div>
                    <strong>${UI.esc(u.name)}</strong>
                    <div class="dim" style="font-size:var(--t-xs)">${UI.esc(u.email)}</div>
                  </div>
                </div>
              </td>
              <td><span class="chip ${u.role === 'admin' ? 'chip-brand' : ''}">${UI.esc(u.role)}</span></td>
              <td>${UI.date(u.createdAt)}</td>
              <td>
                <span class="status ${u.isActive ? 'status-Delivered' : 'status-Cancelled'}">
                  ${u.isActive ? 'Active' : 'Deactivated'}
                </span>
              </td>
              <td>
                ${u.role === 'admin' ? '<small class="dim">—</small>' : `
                  <button class="btn-sv btn-ghost-sv" data-toggle="${u._id}" data-to="${!u.isActive}"
                          style="padding:4px 10px;font-size:11px;${u.isActive ? 'color:var(--danger)' : 'color:var(--success)'}">
                    ${u.isActive ? 'Deactivate' : 'Activate'}
                  </button>`}
              </td>
            </tr>`).join('')
        : '<tr><td colspan="5" class="text-center dim py-4">No users match this filter.</td></tr>';

      host.querySelectorAll('[data-toggle]').forEach((btn) =>
        btn.addEventListener('click', async () => {
          btn.disabled = true;
          try {
            const res = await SV.api.admin.setUserStatus(btn.dataset.toggle, btn.dataset.to === 'true');
            UI.toastOk(res.message);
            loadUsers();
          } catch (err) { UI.toastErr(err); btn.disabled = false; }
        })
      );
    } catch (err) {
      host.innerHTML = `<tr><td colspan="5" class="dim">${UI.esc(err.message)}</td></tr>`;
    }
  }

  /* --------------------------------- orders ------------------------------ */

  async function orders() {
    view.innerHTML = `
      <h1 style="font-size:var(--t-xl)" class="mb-1">All Orders</h1>
      <p class="muted" style="font-size:var(--t-sm)">Every order placed on the platform.</p>
      <div class="d-flex flex-wrap gap-2 my-4" id="oFilters">
        <button class="chip chip-brand" data-s="">All</button>
        <button class="chip" data-s="Placed">Placed</button>
        <button class="chip" data-s="Confirmed">Confirmed</button>
        <button class="chip" data-s="Shipped">Shipped</button>
        <button class="chip" data-s="Delivered">Delivered</button>
        <button class="chip" data-s="Cancelled">Cancelled</button>
      </div>
      <div class="sv-card sv-card-pad">
        <div class="table-scroll"><table class="tbl">
          <thead><tr><th>Order</th><th>Customer</th><th>Amount</th><th>Payment</th><th>Status</th><th></th></tr></thead>
          <tbody id="adminOrderRows">${UI.skeletonRows(8, 6)}</tbody>
        </table></div>
      </div>`;

    document.querySelectorAll('#oFilters [data-s]').forEach((btn) =>
      btn.addEventListener('click', () => {
        document.querySelectorAll('#oFilters [data-s]').forEach((b) => b.classList.remove('chip-brand'));
        btn.classList.add('chip-brand');
        loadAdminOrders(btn.dataset.s);
      })
    );
    loadAdminOrders();
  }

  async function loadAdminOrders(status = '') {
    const host = document.getElementById('adminOrderRows');
    if (!host) return;
    try {
      const { data } = await SV.api.admin.orders({ status: status || undefined, limit: 100 });
      host.innerHTML = data.length
        ? data.map((o) => `
            <tr>
              <td><strong>#${UI.esc(o.orderNumber)}</strong><br><small class="dim">${UI.date(o.createdAt)}</small></td>
              <td>${UI.esc(o.user?.name || '—')}<br><small class="dim">${UI.esc(o.user?.email || '')}</small></td>
              <td class="price"><strong>${UI.money(o.totalAmount)}</strong></td>
              <td>
                <div style="font-size:var(--t-xs)">${UI.esc(o.paymentMode)}</div>
                <span class="status status-${UI.esc(o.paymentStatus)}">${UI.esc(o.paymentStatus)}</span>
              </td>
              <td><span class="status status-${UI.esc(o.status)}">${UI.esc(o.status)}</span></td>
              <td><a href="order.html?id=${o._id}" style="font-size:var(--t-xs)">View</a></td>
            </tr>`).join('')
        : '<tr><td colspan="6" class="text-center dim py-4">No orders found.</td></tr>';
    } catch (err) {
      host.innerHTML = `<tr><td colspan="6" class="dim">${UI.esc(err.message)}</td></tr>`;
    }
  }

  /* ------------------------------- categories ---------------------------- */

  async function categories() {
    view.innerHTML = `
      <div class="d-flex flex-wrap justify-content-between align-items-center gap-3 mb-4">
        <div>
          <h1 style="font-size:var(--t-xl);margin:0">Categories</h1>
          <p class="muted mb-0" style="font-size:var(--t-sm)">Parent categories and their sub-categories.</p>
        </div>
        <button class="btn-sv btn-primary-sv" id="addCat"><i class="bi bi-plus-lg"></i> Add category</button>
      </div>
      <div class="row g-3" id="catGrid"></div>`;

    document.getElementById('addCat').addEventListener('click', () => openCatModal());
    loadCategoryGrid();
  }

  async function loadCategoryGrid() {
    const host = document.getElementById('catGrid');
    try {
      const { data: tree } = await SV.api.categories.tree();
      host.innerHTML = tree
        .map((p) => `
          <div class="col-md-6 col-xl-4">
            <div class="sv-card sv-card-pad h-100">
              <div class="d-flex justify-content-between align-items-start mb-3">
                <div class="d-flex align-items-center gap-2">
                  <span class="d-grid" style="width:40px;height:40px;border-radius:var(--r-sm);background:var(--brand-50);color:var(--brand-700);place-items:center;font-size:18px">
                    <i class="bi ${UI.esc(p.icon || 'bi-tag')}"></i>
                  </span>
                  <div>
                    <strong>${UI.esc(p.name)}</strong>
                    <div class="dim" style="font-size:var(--t-xs)">${p.children.length} sub-categories</div>
                  </div>
                </div>
                <button class="btn-sv btn-ghost-sv" data-delcat="${p._id}" style="padding:3px 8px;font-size:11px;color:var(--danger)">
                  <i class="bi bi-trash"></i>
                </button>
              </div>
              <div class="d-flex flex-wrap gap-1">
                ${p.children.map((c) => `
                  <span class="chip">${UI.esc(c.name)}
                    <button data-delcat="${c._id}" aria-label="Delete ${UI.esc(c.name)}"><i class="bi bi-x" style="font-size:11px"></i></button>
                  </span>`).join('') || '<small class="dim">No sub-categories.</small>'}
              </div>
            </div>
          </div>`)
        .join('');

      host.querySelectorAll('[data-delcat]').forEach((btn) =>
        btn.addEventListener('click', async () => {
          if (!confirm('Delete this category? It must have no products or sub-categories.')) return;
          try {
            await SV.api.categories.remove(btn.dataset.delcat);
            UI.toastOk('Category deleted.');
            loadCategoryGrid();
          } catch (err) { UI.toastErr(err); }
        })
      );
    } catch (err) {
      host.innerHTML = `<div class="col-12">${UI.empty('bi-plug', 'Could not load categories', err.message)}</div>`;
    }
  }

  async function openCatModal() {
    const { data } = await SV.api.categories.list({ parent: 'null' });
    document.getElementById('catParent').innerHTML =
      '<option value="">None (top-level)</option>' +
      data.map((c) => `<option value="${c._id}">${UI.esc(c.name)}</option>`).join('');

    catModal = catModal || new bootstrap.Modal(document.getElementById('catModal'));
    catModal.show();
  }

  document.getElementById('catForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    try {
      await SV.api.categories.create({
        name: document.getElementById('catName').value.trim(),
        parent: document.getElementById('catParent').value || null,
        icon: document.getElementById('catIcon').value.trim() || 'bi-tag',
      });
      UI.toastOk('Category created.');
      catModal.hide();
      e.target.reset();
      loadCategoryGrid();
    } catch (err) { UI.toastErr(err); }
  });

  /* -------------------------------- coupons ------------------------------ */

  async function coupons() {
    view.innerHTML = `
      <div class="d-flex flex-wrap justify-content-between align-items-center gap-3 mb-4">
        <div>
          <h1 style="font-size:var(--t-xl);margin:0">Coupons</h1>
          <p class="muted mb-0" style="font-size:var(--t-sm)">Discount codes customers can apply at checkout.</p>
        </div>
        <button class="btn-sv btn-primary-sv" id="addCoupon"><i class="bi bi-plus-lg"></i> Create coupon</button>
      </div>
      <div class="sv-card sv-card-pad">
        <div class="table-scroll"><table class="tbl">
          <thead><tr><th>Code</th><th>Discount</th><th>Min order</th><th>Expires</th><th>Used</th><th>Status</th><th></th></tr></thead>
          <tbody id="couponRows">${UI.skeletonRows(5, 7)}</tbody>
        </table></div>
      </div>`;

    document.getElementById('addCoupon').addEventListener('click', () => {
      couponModal = couponModal || new bootstrap.Modal(document.getElementById('couponModal'));
      couponModal.show();
    });
    loadCoupons();
  }

  async function loadCoupons() {
    const host = document.getElementById('couponRows');
    if (!host) return;
    try {
      const { data } = await SV.api.coupons.list();
      host.innerHTML = data.length
        ? data.map((c) => {
            const expired = new Date(c.expiresAt) < new Date();
            return `
            <tr>
              <td><strong>${UI.esc(c.code)}</strong><br><small class="dim">${UI.esc(c.description || '')}</small></td>
              <td>${c.type === 'percentage'
                    ? `${c.value}%${c.maxDiscount ? ` (max ${UI.money(c.maxDiscount)})` : ''}`
                    : UI.money(c.value)}</td>
              <td class="price">${UI.money(c.minOrderValue)}</td>
              <td>${UI.date(c.expiresAt)}</td>
              <td class="num">${c.usedCount}${c.usageLimit ? ` / ${c.usageLimit}` : ''}</td>
              <td>
                <span class="status ${expired || !c.isActive ? 'status-Cancelled' : 'status-Delivered'}">
                  ${expired ? 'Expired' : c.isActive ? 'Active' : 'Disabled'}
                </span>
              </td>
              <td>
                <button class="btn-sv btn-ghost-sv" data-delcoupon="${c._id}" style="padding:4px 9px;font-size:11px;color:var(--danger)">Delete</button>
              </td>
            </tr>`;
          }).join('')
        : '<tr><td colspan="7" class="text-center dim py-4">No coupons yet.</td></tr>';

      host.querySelectorAll('[data-delcoupon]').forEach((btn) =>
        btn.addEventListener('click', async () => {
          if (!confirm('Delete this coupon?')) return;
          try {
            await SV.api.coupons.remove_(btn.dataset.delcoupon);
            UI.toastOk('Coupon deleted.');
            loadCoupons();
          } catch (err) { UI.toastErr(err); }
        })
      );
    } catch (err) {
      host.innerHTML = `<tr><td colspan="7" class="dim">${UI.esc(err.message)}</td></tr>`;
    }
  }

  document.getElementById('couponForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    try {
      await SV.api.coupons.create({
        code: document.getElementById('cCode').value.trim().toUpperCase(),
        type: document.getElementById('cType').value,
        value: Number(document.getElementById('cValue').value),
        maxDiscount: Number(document.getElementById('cMax').value) || 0,
        minOrderValue: Number(document.getElementById('cMin').value) || 0,
        expiresAt: new Date(document.getElementById('cExp').value).toISOString(),
        description: document.getElementById('cDesc').value.trim(),
      });
      UI.toastOk('Coupon created.');
      couponModal.hide();
      e.target.reset();
      loadCoupons();
    } catch (err) {
      UI.toastErr(err);
      (err.errors || []).forEach((fe) => UI.toast(`${fe.field}: ${fe.message}`, 'error'));
    }
  });

  /* -------------------------------- reports ------------------------------ */

  async function reports() {
    view.innerHTML = `
      <div class="d-flex flex-wrap justify-content-between align-items-center gap-3 mb-4">
        <div>
          <h1 style="font-size:var(--t-xl);margin:0">Reports</h1>
          <p class="muted mb-0" style="font-size:var(--t-sm)">Sales, growth and inventory health.</p>
        </div>
        <select class="select" id="repRange" style="width:auto">
          <option value="30">Last 30 days</option>
          <option value="90" selected>Last 90 days</option>
          <option value="365">Last year</option>
        </select>
      </div>
      <div class="row g-3" id="repBody">
        <div class="col-12"><div class="sv-card sv-card-pad"><div class="sk sk-text" style="height:220px"></div></div></div>
      </div>`;

    document.getElementById('repRange').addEventListener('change', (e) => loadReports(Number(e.target.value)));
    loadReports(90);
  }

  async function loadReports(days) {
    const host = document.getElementById('repBody');
    try {
      const [sales, growth, inv] = await Promise.all([
        SV.api.admin.salesReport({ days, groupBy: days > 120 ? 'month' : 'day' }),
        SV.api.admin.userGrowth({ days }),
        SV.api.admin.inventory(),
      ]);

      const s = sales.meta;
      const summary = inv.data.summary;

      host.innerHTML = `
        <div class="col-6 col-lg-3">${kpi('bi-currency-rupee', 'var(--success-bg)', 'var(--success)', UI.money(s.revenue), `Revenue (${days}d)`)}</div>
        <div class="col-6 col-lg-3">${kpi('bi-receipt', 'var(--info-bg)', 'var(--info)', s.orders, 'Orders')}</div>
        <div class="col-6 col-lg-3">${kpi('bi-graph-up', 'var(--brand-50)', 'var(--brand-700)', UI.money(s.averageOrderValue), 'Avg. order value')}</div>
        <div class="col-6 col-lg-3">${kpi('bi-ticket-perforated', 'var(--warning-bg)', 'var(--warning)', UI.money(s.discountGiven), 'Discounts given')}</div>

        <div class="col-lg-8">
          <div class="sv-card sv-card-pad">
            <h2 style="font-size:var(--t-md)" class="mb-3">Sales report</h2>
            <canvas id="repSales" height="110"></canvas>
          </div>
        </div>
        <div class="col-lg-4">
          <div class="sv-card sv-card-pad h-100">
            <h2 style="font-size:var(--t-md)" class="mb-3">Users by role</h2>
            <canvas id="repRoles" height="180"></canvas>
          </div>
        </div>

        <div class="col-lg-8">
          <div class="sv-card sv-card-pad">
            <h2 style="font-size:var(--t-md)" class="mb-3">User growth</h2>
            <canvas id="repGrowth" height="110"></canvas>
          </div>
        </div>
        <div class="col-lg-4">
          <div class="sv-card sv-card-pad h-100">
            <h2 style="font-size:var(--t-md)" class="mb-3">Inventory health</h2>
            <div class="sum-row"><span>Products listed</span><strong class="num">${summary.totalProducts}</strong></div>
            <div class="sum-row"><span>Units in stock</span><strong class="num">${summary.totalStockUnits}</strong></div>
            <div class="sum-row"><span>Inventory value</span><strong class="price">${UI.money(summary.inventoryValue)}</strong></div>
            <div class="sum-row"><span>Low stock</span><strong class="stock-warn num">${summary.lowStock}</strong></div>
            <div class="sum-row"><span>Out of stock</span><strong class="stock-out num">${summary.outOfStock}</strong></div>
            ${inv.data.critical.length ? `
              <hr>
              <small class="dim d-block mb-2">NEEDS RESTOCKING</small>
              ${inv.data.critical.slice(0, 5).map((p) => `
                <div class="d-flex justify-content-between align-items-center mb-1" style="font-size:var(--t-xs)">
                  <span class="text-truncate" style="max-width:170px">${UI.esc(p.name)}</span>
                  <span class="${p.stock === 0 ? 'stock-out' : 'stock-warn'} num">${p.stock}</span>
                </div>`).join('')}` : ''}
          </div>
        </div>`;

      charts.repSales?.destroy();
      charts.repSales = new Chart(document.getElementById('repSales'), {
        type: 'line',
        data: {
          labels: sales.data.map((d) => d.period),
          datasets: [{
            label: 'Revenue',
            data: sales.data.map((d) => d.revenue),
            borderColor: '#2d6a4f',
            backgroundColor: 'rgba(45,106,79,.14)',
            fill: true,
            tension: 0.3,
            pointRadius: 0,
            borderWidth: 2,
          }],
        },
        options: {
          responsive: true,
          plugins: { legend: { display: false } },
          scales: {
            y: { beginAtZero: true, ticks: { callback: (v) => `₹${v >= 1000 ? `${v / 1000}k` : v}` } },
            x: { grid: { display: false }, ticks: { maxTicksLimit: 10 } },
          },
        },
      });

      charts.repGrowth?.destroy();
      charts.repGrowth = new Chart(document.getElementById('repGrowth'), {
        type: 'line',
        data: {
          labels: growth.data.map((d) => d.date),
          datasets: [{
            label: 'Cumulative users',
            data: growth.data.map((d) => d.cumulative),
            borderColor: '#1565c0',
            backgroundColor: 'rgba(21,101,192,.12)',
            fill: true,
            tension: 0.3,
            pointRadius: 0,
            borderWidth: 2,
          }],
        },
        options: {
          responsive: true,
          plugins: { legend: { display: false } },
          scales: {
            y: { beginAtZero: true },
            x: { grid: { display: false }, ticks: { maxTicksLimit: 10 } },
          },
        },
      });

      const roles = growth.meta.byRole || {};
      charts.repRoles?.destroy();
      charts.repRoles = new Chart(document.getElementById('repRoles'), {
        type: 'doughnut',
        data: {
          labels: Object.keys(roles),
          datasets: [{
            data: Object.values(roles),
            backgroundColor: ['#2d6a4f', '#1565c0', '#f0a202'],
            borderWidth: 0,
          }],
        },
        options: {
          responsive: true,
          cutout: '60%',
          plugins: { legend: { position: 'bottom', labels: { boxWidth: 10, font: { size: 11 } } } },
        },
      });
    } catch (err) {
      host.innerHTML = `<div class="col-12">${UI.empty('bi-plug', 'Could not load reports', err.message)}</div>`;
    }
  }

  go(location.hash.slice(1) || 'dashboard');
})();
</script>
</body>
</html>
