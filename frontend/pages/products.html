<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>All Products — ShopVerse</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@600;700;800&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="../assets/css/tokens.css" rel="stylesheet">
  <link href="../assets/css/main.css" rel="stylesheet">
  <style>
    .filters-panel { position: sticky; top: calc(var(--header-h) + var(--s-4)); }
    /* List view reuses the same card markup, just re-flowed. */
    .grid.list .col-item { width: 100%; }
    .grid.list .product-card { flex-direction: row; }
    .grid.list .product-card .thumb { width: 200px; flex-shrink: 0; aspect-ratio: 1; }
    .grid.list .product-card .body { justify-content: center; }
    .grid.list .product-card .title { -webkit-line-clamp: 1; line-clamp: 1; min-height: 0; }
    @media (max-width: 575px) { .grid.list .product-card { flex-direction: column; } .grid.list .product-card .thumb { width: 100%; } }
  </style>
</head>
<body>

<div id="sv-header"></div>

<main class="container-sv" style="padding-block:var(--s-6)">

  <nav aria-label="breadcrumb" class="mb-3">
    <ol class="breadcrumb mb-0" style="font-size:var(--t-sm)">
      <li class="breadcrumb-item"><a href="../index.html">Home</a></li>
      <li class="breadcrumb-item active" aria-current="page" id="crumbTitle">All Products</li>
    </ol>
  </nav>

  <div class="row g-4">

    <!-- ============================ FILTERS ============================ -->
    <aside class="col-lg-3">
      <div class="sv-card sv-card-pad filters-panel">
        <div class="d-flex justify-content-between align-items-center mb-2">
          <h2 style="font-size:var(--t-md);margin:0">Filters</h2>
          <button class="btn-sv btn-ghost-sv" id="clearAll" style="padding:4px 10px;font-size:var(--t-xs)">
            Clear all
          </button>
        </div>

        <!-- category -->
        <div class="filter-group" data-group>
          <button class="filter-head" type="button" aria-expanded="true">
            Category <i class="bi bi-chevron-down"></i>
          </button>
          <div class="filter-body" id="catFilters">
            <div class="sk sk-text" style="width:70%"></div>
            <div class="sk sk-text" style="width:55%"></div>
            <div class="sk sk-text" style="width:62%"></div>
          </div>
        </div>

        <!-- price -->
        <div class="filter-group" data-group>
          <button class="filter-head" type="button" aria-expanded="true">
            Price range <i class="bi bi-chevron-down"></i>
          </button>
          <div class="filter-body">
            <div class="range-wrap">
              <div class="range-track"></div>
              <div class="range-fill" id="rangeFill"></div>
              <input type="range" id="minPrice" min="0" max="100000" step="500" value="0" aria-label="Minimum price">
              <input type="range" id="maxPrice" min="0" max="100000" step="500" value="100000" aria-label="Maximum price">
            </div>
            <div class="d-flex justify-content-between price" style="font-size:var(--t-sm);font-weight:600">
              <span id="minLabel">₹0</span>
              <span id="maxLabel">₹1,00,000</span>
            </div>
          </div>
        </div>

        <!-- rating -->
        <div class="filter-group" data-group>
          <button class="filter-head" type="button" aria-expanded="true">
            Customer rating <i class="bi bi-chevron-down"></i>
          </button>
          <div class="filter-body">
            <label class="check"><input type="radio" name="rating" value="4"> <span class="stars"><i class="bi bi-star-fill"></i><i class="bi bi-star-fill"></i><i class="bi bi-star-fill"></i><i class="bi bi-star-fill"></i></span> &amp; above</label>
            <label class="check"><input type="radio" name="rating" value="3"> <span class="stars"><i class="bi bi-star-fill"></i><i class="bi bi-star-fill"></i><i class="bi bi-star-fill"></i></span> &amp; above</label>
            <label class="check"><input type="radio" name="rating" value="2"> <span class="stars"><i class="bi bi-star-fill"></i><i class="bi bi-star-fill"></i></span> &amp; above</label>
          </div>
        </div>

        <!-- availability -->
        <div class="filter-group" data-group>
          <button class="filter-head" type="button" aria-expanded="true">
            Availability <i class="bi bi-chevron-down"></i>
          </button>
          <div class="filter-body">
            <label class="check"><input type="checkbox" id="inStock"> In stock only</label>
          </div>
        </div>

        <!-- brand -->
        <div class="filter-group collapsed" data-group>
          <button class="filter-head" type="button" aria-expanded="false">
            Brand <i class="bi bi-chevron-down"></i>
          </button>
          <div class="filter-body" id="brandFilters"></div>
        </div>
      </div>
    </aside>

    <!-- ============================ RESULTS ============================ -->
    <section class="col-lg-9">

      <div class="d-flex flex-wrap justify-content-between align-items-center gap-3 mb-3">
        <div>
          <h1 style="font-size:var(--t-xl);margin:0" id="listTitle">All Products</h1>
          <p class="muted mb-0" style="font-size:var(--t-sm)" id="resultCount">Loading…</p>
        </div>
        <div class="d-flex align-items-center gap-2">
          <div class="btn-group" role="group" aria-label="View mode">
            <button class="btn btn-sm btn-outline-secondary active" id="gridView" aria-label="Grid view">
              <i class="bi bi-grid-3x3-gap"></i>
            </button>
            <button class="btn btn-sm btn-outline-secondary" id="listView" aria-label="List view">
              <i class="bi bi-list-ul"></i>
            </button>
          </div>
          <label class="d-flex align-items-center gap-2" style="font-size:var(--t-sm)">
            <span class="muted">Sort by</span>
            <select class="select" id="sortBy" style="width:auto">
              <option value="featured">Featured</option>
              <option value="newest">Newest</option>
              <option value="price-asc">Price: Low to High</option>
              <option value="price-desc">Price: High to Low</option>
              <option value="rating">Customer Rating</option>
              <option value="popular">Best Selling</option>
            </select>
          </label>
        </div>
      </div>

      <!-- active filter chips -->
      <div class="d-flex flex-wrap gap-2 mb-3" id="activeChips"></div>

      <div class="row g-3 g-md-4 grid" id="grid"></div>

      <nav class="mt-5" aria-label="Product pages">
        <ul class="pagination justify-content-center" id="pager"></ul>
      </nav>
    </section>
  </div>
</main>

<div id="sv-footer"></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="../assets/js/api.js"></script>
<script src="../assets/js/ui.js"></script>
<script>
(async function () {
  UI.mountLayout();

  const grid = document.getElementById('grid');
  const chips = document.getElementById('activeChips');
  const pager = document.getElementById('pager');
  UI.wireProductGrid(grid);

  const MAX_PRICE = 100000;
  let categories = [];

  /* State is initialised from the URL so every filtered view is shareable. */
  const state = {
    search: UI.qs('search') || '',
    category: UI.qs('category') || '',
    brand: UI.qs('brand') || '',
    minPrice: Number(UI.qs('minPrice')) || 0,
    maxPrice: Number(UI.qs('maxPrice')) || MAX_PRICE,
    minRating: UI.qs('minRating') || '',
    inStock: UI.qs('inStock') === 'true',
    sort: UI.qs('sort') || 'featured',
    page: Number(UI.qs('page')) || 1,
  };

  document.getElementById('sortBy').value = state.sort;
  document.getElementById('inStock').checked = state.inStock;
  if (state.minRating) {
    const radio = document.querySelector(`input[name="rating"][value="${state.minRating}"]`);
    if (radio) radio.checked = true;
  }

  /* ------------------------- collapsible filter groups ------------------- */
  document.querySelectorAll('[data-group] .filter-head').forEach((head) => {
    head.addEventListener('click', () => {
      const group = head.closest('[data-group]');
      group.classList.toggle('collapsed');
      head.setAttribute('aria-expanded', String(!group.classList.contains('collapsed')));
    });
  });

  /* ------------------------------ price slider --------------------------- */
  const minEl = document.getElementById('minPrice');
  const maxEl = document.getElementById('maxPrice');
  const fill = document.getElementById('rangeFill');
  minEl.value = state.minPrice;
  maxEl.value = state.maxPrice;

  function paintRange() {
    const lo = Number(minEl.value);
    const hi = Number(maxEl.value);
    fill.style.left = `${(lo / MAX_PRICE) * 100}%`;
    fill.style.width = `${((hi - lo) / MAX_PRICE) * 100}%`;
    document.getElementById('minLabel').textContent = UI.money(lo);
    document.getElementById('maxLabel').textContent = UI.money(hi);
  }

  // Keep the two handles from crossing each other.
  minEl.addEventListener('input', () => {
    if (Number(minEl.value) > Number(maxEl.value) - 500) minEl.value = Number(maxEl.value) - 500;
    paintRange();
  });
  maxEl.addEventListener('input', () => {
    if (Number(maxEl.value) < Number(minEl.value) + 500) maxEl.value = Number(minEl.value) + 500;
    paintRange();
  });
  [minEl, maxEl].forEach((el) =>
    el.addEventListener('change', () => {
      state.minPrice = Number(minEl.value);
      state.maxPrice = Number(maxEl.value);
      state.page = 1;
      load();
    })
  );
  paintRange();

  /* ------------------------------- other inputs -------------------------- */
  document.getElementById('sortBy').addEventListener('change', (e) => {
    state.sort = e.target.value;
    state.page = 1;
    load();
  });
  document.getElementById('inStock').addEventListener('change', (e) => {
    state.inStock = e.target.checked;
    state.page = 1;
    load();
  });
  document.querySelectorAll('input[name="rating"]').forEach((r) =>
    r.addEventListener('change', () => {
      state.minRating = r.value;
      state.page = 1;
      load();
    })
  );
  document.getElementById('clearAll').addEventListener('click', clearAll);

  document.getElementById('gridView').addEventListener('click', () => setView('grid'));
  document.getElementById('listView').addEventListener('click', () => setView('list'));

  function setView(mode) {
    grid.classList.toggle('list', mode === 'list');
    document.getElementById('gridView').classList.toggle('active', mode === 'grid');
    document.getElementById('listView').classList.toggle('active', mode === 'list');
    SV.store.set('sv_view', mode);
    grid.querySelectorAll('.col-item').forEach((col) => {
      col.className = mode === 'list' ? 'col-item col-12' : 'col-item col-6 col-md-4 col-lg-4';
    });
  }

  function clearAll() {
    state.search = '';
    state.category = '';
    state.brand = '';
    state.minPrice = 0;
    state.maxPrice = MAX_PRICE;
    state.minRating = '';
    state.inStock = false;
    state.page = 1;

    minEl.value = 0;
    maxEl.value = MAX_PRICE;
    paintRange();
    document.getElementById('inStock').checked = false;
    document.querySelectorAll('input[name="rating"]').forEach((r) => (r.checked = false));
    document.querySelectorAll('#catFilters input, #brandFilters input').forEach((c) => (c.checked = false));
    load();
  }

  /* ------------------------------- filter data --------------------------- */
  try {
    const { data: tree } = await SV.api.categories.tree();
    categories = tree;
    document.getElementById('catFilters').innerHTML = tree
      .map(
        (c) => `
        <label class="check">
          <input type="checkbox" name="cat" value="${c._id}" ${state.category === c._id ? 'checked' : ''}>
          <span>${UI.esc(c.name)}</span>
        </label>`
      )
      .join('');

    document.querySelectorAll('input[name="cat"]').forEach((box) =>
      box.addEventListener('change', () => {
        // Single-select behaviour: a category filter is a drill-down, not a union.
        document.querySelectorAll('input[name="cat"]').forEach((other) => {
          if (other !== box) other.checked = false;
        });
        state.category = box.checked ? box.value : '';
        state.page = 1;
        load();
      })
    );
  } catch (_) {
    document.getElementById('catFilters').innerHTML =
      '<small class="dim">Could not load categories.</small>';
  }

  try {
    const { data: brands } = await SV.api.products.brands();
    document.getElementById('brandFilters').innerHTML = brands
      .map(
        (b) => `
        <label class="check">
          <input type="checkbox" name="brand" value="${UI.esc(b)}" ${state.brand === b ? 'checked' : ''}>
          <span>${UI.esc(b)}</span>
        </label>`
      )
      .join('');

    document.querySelectorAll('input[name="brand"]').forEach((box) =>
      box.addEventListener('change', () => {
        document.querySelectorAll('input[name="brand"]').forEach((other) => {
          if (other !== box) other.checked = false;
        });
        state.brand = box.checked ? box.value : '';
        state.page = 1;
        load();
      })
    );
  } catch (_) { /* brand filter is optional */ }

  /* -------------------------------- chips -------------------------------- */
  function renderChips() {
    const list = [];
    if (state.search) list.push({ key: 'search', label: `"${state.search}"` });
    if (state.category) {
      const c = categories.find((x) => x._id === state.category);
      list.push({ key: 'category', label: c ? c.name : 'Category' });
    }
    if (state.brand) list.push({ key: 'brand', label: state.brand });
    if (state.minPrice > 0 || state.maxPrice < MAX_PRICE) {
      list.push({ key: 'price', label: `${UI.money(state.minPrice)} – ${UI.money(state.maxPrice)}` });
    }
    if (state.minRating) list.push({ key: 'minRating', label: `${state.minRating}★ & above` });
    if (state.inStock) list.push({ key: 'inStock', label: 'In stock' });

    chips.innerHTML = list.length
      ? list
          .map(
            (c) => `<span class="chip chip-brand">${UI.esc(c.label)}
              <button data-chip="${c.key}" aria-label="Remove filter ${UI.esc(c.label)}">
                <i class="bi bi-x-lg" style="font-size:10px"></i>
              </button></span>`
          )
          .join('') +
        '<button class="chip" id="chipClear">Clear all</button>'
      : '';

    chips.querySelectorAll('[data-chip]').forEach((btn) =>
      btn.addEventListener('click', () => {
        const key = btn.dataset.chip;
        if (key === 'price') {
          state.minPrice = 0;
          state.maxPrice = MAX_PRICE;
          minEl.value = 0;
          maxEl.value = MAX_PRICE;
          paintRange();
        } else if (key === 'inStock') {
          state.inStock = false;
          document.getElementById('inStock').checked = false;
        } else {
          state[key] = key === 'minRating' ? '' : '';
          if (key === 'category') document.querySelectorAll('input[name="cat"]').forEach((c) => (c.checked = false));
          if (key === 'brand') document.querySelectorAll('input[name="brand"]').forEach((c) => (c.checked = false));
          if (key === 'minRating') document.querySelectorAll('input[name="rating"]').forEach((c) => (c.checked = false));
        }
        state.page = 1;
        load();
      })
    );
    document.getElementById('chipClear')?.addEventListener('click', clearAll);
  }

  /* -------------------------------- loading ------------------------------ */
  async function load() {
    grid.innerHTML = UI.skeletonCards(9);
    renderChips();
    syncUrl();

    try {
      const res = await SV.api.products.list({
        search: state.search || undefined,
        category: state.category || undefined,
        brand: state.brand || undefined,
        minPrice: state.minPrice || undefined,
        maxPrice: state.maxPrice < MAX_PRICE ? state.maxPrice : undefined,
        minRating: state.minRating || undefined,
        inStock: state.inStock ? 'true' : undefined,
        sort: state.sort,
        page: state.page,
        limit: 12,
      });

      const { data: products, meta } = res;

      document.getElementById('resultCount').textContent = meta.total
        ? `Showing ${(meta.page - 1) * meta.limit + 1}–${Math.min(meta.page * meta.limit, meta.total)} of ${meta.total} products`
        : 'No products found';

      if (state.search) {
        document.getElementById('listTitle').textContent = `Results for "${state.search}"`;
        document.getElementById('crumbTitle').textContent = 'Search';
      }

      if (!products.length) {
        grid.innerHTML = `<div class="col-12">${UI.empty(
          'bi-search',
          'No products match these filters',
          'Try widening your price range or clearing a filter.'
        )}</div>`;
        grid.querySelector('.empty')?.insertAdjacentHTML(
          'beforeend',
          '<button class="btn-sv btn-primary-sv" id="emptyClear">Clear filters</button>'
        );
        document.getElementById('emptyClear')?.addEventListener('click', clearAll);
        pager.innerHTML = '';
        return;
      }

      const isList = grid.classList.contains('list');
      grid.innerHTML = products
        .map(
          (p) =>
            `<div class="col-item ${isList ? 'col-12' : 'col-6 col-md-4 col-lg-4'}">${UI.productCard(p)}</div>`
        )
        .join('');

      renderPager(meta);
    } catch (err) {
      grid.innerHTML = `<div class="col-12">${UI.empty(
        'bi-plug', 'Cannot reach the API', err.message
      )}</div>`;
      pager.innerHTML = '';
    }
  }

  function renderPager(meta) {
    if (meta.totalPages <= 1) { pager.innerHTML = ''; return; }

    const item = (label, page, { disabled, active } = {}) => `
      <li class="page-item ${disabled ? 'disabled' : ''} ${active ? 'active' : ''}">
        <button class="page-link" data-page="${page}" ${disabled ? 'tabindex="-1"' : ''}>${label}</button>
      </li>`;

    let html = item('<i class="bi bi-chevron-left"></i>', meta.page - 1, { disabled: !meta.hasPrevPage });
    const from = Math.max(1, meta.page - 2);
    const to = Math.min(meta.totalPages, from + 4);
    for (let i = from; i <= to; i += 1) html += item(i, i, { active: i === meta.page });
    html += item('<i class="bi bi-chevron-right"></i>', meta.page + 1, { disabled: !meta.hasNextPage });

    pager.innerHTML = html;
    pager.querySelectorAll('[data-page]').forEach((btn) =>
      btn.addEventListener('click', () => {
        const p = Number(btn.dataset.page);
        if (p >= 1 && p <= meta.totalPages) {
          state.page = p;
          load();
          window.scrollTo({ top: 0, behavior: 'smooth' });
        }
      })
    );
  }

  /** Reflect state in the address bar without adding history entries. */
  function syncUrl() {
    const params = new URLSearchParams();
    Object.entries(state).forEach(([k, v]) => {
      if (v && !(k === 'maxPrice' && v === MAX_PRICE) && !(k === 'page' && v === 1)) {
        params.set(k, v);
      }
    });
    history.replaceState(null, '', params.toString() ? `?${params}` : location.pathname);
  }

  if (SV.store.get('sv_view') === 'list') setView('list');
  load();
})();
</script>
</body>
</html>
