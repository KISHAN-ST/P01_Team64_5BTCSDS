<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Orders — ShopVerse</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@600;700;800&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="../assets/css/tokens.css" rel="stylesheet">
  <link href="../assets/css/main.css" rel="stylesheet">
</head>
<body>

<div id="sv-header"></div>

<main class="container-sv" style="padding-block:var(--s-6)">
  <h1 style="font-size:var(--t-xl)" class="mb-1">My Orders</h1>
  <p class="muted" style="font-size:var(--t-sm)">Track, review and manage everything you have ordered.</p>

  <div class="d-flex flex-wrap gap-2 my-4" id="statusFilters">
    <button class="chip chip-brand" data-status="">All</button>
    <button class="chip" data-status="Placed">Placed</button>
    <button class="chip" data-status="Confirmed">Confirmed</button>
    <button class="chip" data-status="Shipped">Shipped</button>
    <button class="chip" data-status="Delivered">Delivered</button>
    <button class="chip" data-status="Cancelled">Cancelled</button>
  </div>

  <div id="orderList"></div>
</main>

<div id="sv-footer"></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="../assets/js/api.js"></script>
<script src="../assets/js/ui.js"></script>
<script>
(async function () {
  UI.mountLayout();
  if (!UI.requireAuth('customer')) return;

  const list = document.getElementById('orderList');
  let currentStatus = '';

  document.querySelectorAll('#statusFilters [data-status]').forEach((btn) =>
    btn.addEventListener('click', () => {
      document.querySelectorAll('#statusFilters [data-status]').forEach((b) =>
        b.classList.remove('chip-brand')
      );
      btn.classList.add('chip-brand');
      currentStatus = btn.dataset.status;
      load();
    })
  );

  async function load() {
    list.innerHTML = '<div class="sv-card sv-card-pad"><div class="sk sk-text" style="height:80px"></div></div>';
    try {
      const { data: orders } = await SV.api.orders.mine({
        status: currentStatus || undefined,
        limit: 50,
      });

      if (!orders.length) {
        list.innerHTML = UI.empty(
          'bi-box-seam',
          currentStatus ? `No ${currentStatus.toLowerCase()} orders` : 'No orders yet',
          'When you place an order it will show up here.',
          { href: 'products.html', label: 'Start shopping' }
        );
        return;
      }

      list.innerHTML = orders.map(card).join('');
      wire();
    } catch (err) {
      list.innerHTML = UI.empty('bi-plug', 'Could not load your orders', err.message);
    }
  }

  function card(o) {
    // Cancellation is only offered while the parcel has not shipped - the same
    // rule the API enforces, mirrored in the UI so the button never lies.
    const canCancel = ['Placed', 'Confirmed'].includes(o.status);
    const isDelivered = o.status === 'Delivered';

    return `
    <div class="sv-card sv-card-pad mb-3">
      <div class="d-flex flex-wrap justify-content-between align-items-start gap-3 mb-3">
        <div>
          <div class="d-flex align-items-center gap-2 flex-wrap">
            <strong style="font-size:var(--t-sm)">#${UI.esc(o.orderNumber)}</strong>
            <span class="status status-${UI.esc(o.status)}">${UI.esc(o.status)}</span>
            <span class="status status-${UI.esc(o.paymentStatus)}">${UI.esc(o.paymentStatus)}</span>
          </div>
          <small class="dim">Placed on ${UI.date(o.createdAt, true)}</small>
        </div>
        <div class="text-end">
          <div class="dim" style="font-size:var(--t-xs)">Total</div>
          <strong class="price" style="font-size:var(--t-md)">${UI.money(o.totalAmount)}</strong>
        </div>
      </div>

      <div class="d-flex flex-wrap gap-3 mb-3">
        ${o.items.slice(0, 4).map((i) => `
          <div class="d-flex gap-2 align-items-center" style="min-width:190px">
            <img src="${UI.esc(i.image)}" alt="" style="width:48px;height:48px;object-fit:cover;border-radius:var(--r-sm);background:var(--surface-2)">
            <div class="min-w-0">
              <div class="text-truncate" style="font-size:var(--t-xs);font-weight:600;max-width:170px">${UI.esc(i.name)}</div>
              <small class="dim">Qty ${i.quantity} · ${UI.money(i.price)}</small>
            </div>
          </div>`).join('')}
        ${o.items.length > 4 ? `<span class="chip">+${o.items.length - 4} more</span>` : ''}
      </div>

      <div class="d-flex flex-wrap gap-2">
        <a href="order.html?id=${o._id}" class="btn-sv btn-outline-sv" style="padding:6px 14px;font-size:var(--t-xs)">
          <i class="bi bi-truck"></i> Track order
        </a>
        ${isDelivered ? o.items.map((i) => `
          <a href="product.html?id=${i.product}#reviews" class="btn-sv btn-ghost-sv" style="padding:6px 14px;font-size:var(--t-xs)">
            <i class="bi bi-star"></i> Review "${UI.esc(i.name.slice(0, 22))}${i.name.length > 22 ? '…' : ''}"
          </a>`).join('') : ''}
        ${canCancel ? `
          <button class="btn-sv btn-ghost-sv" data-cancel="${o._id}" style="padding:6px 14px;font-size:var(--t-xs);color:var(--danger)">
            <i class="bi bi-x-circle"></i> Cancel order
          </button>` : ''}
      </div>
    </div>`;
  }

  function wire() {
    list.querySelectorAll('[data-cancel]').forEach((btn) =>
      btn.addEventListener('click', async () => {
        if (!confirm('Cancel this order? Stock will be returned to the seller.')) return;

        btn.disabled = true;
        try {
          await SV.api.orders.cancel(btn.dataset.cancel, 'Cancelled by customer from My Orders.');
          UI.toastOk('Order cancelled and stock restored.');
          load();
        } catch (err) {
          UI.toastErr(err);
          btn.disabled = false;
        }
      })
    );
  }

  load();
})();
</script>
</body>
</html>
