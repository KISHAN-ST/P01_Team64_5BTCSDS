<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Profile — ShopVerse</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@600;700;800&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="../assets/css/tokens.css" rel="stylesheet">
  <link href="../assets/css/main.css" rel="stylesheet">
</head>
<body>

<div id="sv-header"></div>

<main class="container-sv" style="padding-block:var(--s-6);max-width:920px">
  <h1 style="font-size:var(--t-xl)" class="mb-4">My Profile</h1>

  <div class="row g-4">
    <div class="col-lg-6">
      <div class="sv-card sv-card-pad">
        <h2 style="font-size:var(--t-md)" class="mb-3">Account details</h2>
        <form id="profileForm">
          <div class="field">
            <label for="pfName">Full name</label>
            <input class="input" id="pfName" required>
          </div>
          <div class="field">
            <label for="pfEmail">Email</label>
            <input class="input" id="pfEmail" disabled>
            <span class="field-hint">Email cannot be changed.</span>
          </div>
          <div class="field">
            <label for="pfPhone">Phone</label>
            <input class="input" id="pfPhone">
          </div>
          <div id="sellerFields" hidden>
            <div class="field">
              <label for="pfShop">Shop name</label>
              <input class="input" id="pfShop">
            </div>
            <div class="field">
              <label for="pfShopDesc">Shop description</label>
              <textarea class="textarea" id="pfShopDesc" rows="3"></textarea>
            </div>
          </div>
          <button class="btn-sv btn-primary-sv" type="submit">Save changes</button>
        </form>
      </div>

      <div class="sv-card sv-card-pad mt-3">
        <h2 style="font-size:var(--t-md)" class="mb-3">Change password</h2>
        <form id="pwForm">
          <div class="field">
            <label for="pwCurrent">Current password</label>
            <input class="input" type="password" id="pwCurrent" required>
          </div>
          <div class="field">
            <label for="pwNew">New password</label>
            <input class="input" type="password" id="pwNew" required minlength="6">
            <span class="field-hint">At least 6 characters.</span>
          </div>
          <button class="btn-sv btn-outline-sv" type="submit">Update password</button>
        </form>
      </div>
    </div>

    <div class="col-lg-6">
      <div class="sv-card sv-card-pad">
        <div class="d-flex justify-content-between align-items-center mb-3">
          <h2 style="font-size:var(--t-md);margin:0">Saved addresses</h2>
          <button class="btn-sv btn-ghost-sv" id="toggleAddr" style="padding:4px 10px;font-size:var(--t-xs)">
            <i class="bi bi-plus-lg"></i> Add
          </button>
        </div>

        <form id="addrForm" hidden class="mb-4">
          <div class="row g-2">
            <div class="col-6"><input class="input" id="afName" placeholder="Full name" required></div>
            <div class="col-6"><input class="input" id="afPhone" placeholder="Phone" required></div>
            <div class="col-12"><input class="input" id="afLine1" placeholder="Address line 1" required></div>
            <div class="col-12"><input class="input" id="afLine2" placeholder="Address line 2 (optional)"></div>
            <div class="col-4"><input class="input" id="afPin" placeholder="Pincode" maxlength="6" required></div>
            <div class="col-4"><input class="input" id="afCity" placeholder="City" required></div>
            <div class="col-4"><input class="input" id="afState" placeholder="State"></div>
          </div>
          <button class="btn-sv btn-primary-sv mt-3" type="submit">Save address</button>
        </form>

        <div id="addrList"></div>
      </div>

      <div class="sv-card sv-card-pad mt-3" id="reviewsCard" hidden>
        <h2 style="font-size:var(--t-md)" class="mb-3">My reviews</h2>
        <div id="myReviews"></div>
      </div>
    </div>
  </div>
</main>

<div id="sv-footer"></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="../assets/js/api.js"></script>
<script src="../assets/js/ui.js"></script>
<script>
(async function () {
  UI.mountLayout();
  if (!UI.requireAuth()) return;

  let user;
  try {
    const res = await SV.api.auth.me();
    user = res.data;
  } catch (err) {
    UI.toastErr(err);
    return;
  }

  document.getElementById('pfName').value = user.name || '';
  document.getElementById('pfEmail').value = user.email || '';
  document.getElementById('pfPhone').value = user.phone || '';

  if (user.role === 'seller') {
    document.getElementById('sellerFields').hidden = false;
    document.getElementById('pfShop').value = user.sellerProfile?.shopName || '';
    document.getElementById('pfShopDesc').value = user.sellerProfile?.description || '';
  }

  document.getElementById('profileForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    try {
      const res = await SV.api.auth.updateMe({
        name: document.getElementById('pfName').value.trim(),
        phone: document.getElementById('pfPhone').value.trim(),
        shopName: document.getElementById('pfShop')?.value.trim(),
        shopDescription: document.getElementById('pfShopDesc')?.value.trim(),
      });
      SV.setSession(SV.getToken(), res.data);
      UI.toastOk('Profile updated.');
      setTimeout(() => location.reload(), 600);
    } catch (err) { UI.toastErr(err); }
  });

  document.getElementById('pwForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    try {
      await SV.api.auth.changePassword({
        currentPassword: document.getElementById('pwCurrent').value,
        newPassword: document.getElementById('pwNew').value,
      });
      UI.toastOk('Password changed successfully.');
      e.target.reset();
    } catch (err) { UI.toastErr(err); }
  });

  /* ------------------------------- addresses ----------------------------- */

  document.getElementById('toggleAddr').addEventListener('click', () => {
    const f = document.getElementById('addrForm');
    f.hidden = !f.hidden;
  });

  async function loadAddresses() {
    const host = document.getElementById('addrList');
    try {
      const { data } = await SV.api.auth.addresses();
      host.innerHTML = data.length
        ? data.map((a) => `
            <div class="d-flex justify-content-between align-items-start gap-2 pb-3 mb-3" style="border-bottom:1px solid var(--line)">
              <div>
                <strong style="font-size:var(--t-sm)">${UI.esc(a.fullName)}</strong>
                ${a.isDefault ? '<span class="chip chip-brand ms-1" style="padding:1px 8px;font-size:10px">Default</span>' : ''}
                <div class="muted" style="font-size:var(--t-sm)">
                  ${UI.esc(a.line1)}${a.line2 ? ', ' + UI.esc(a.line2) : ''}<br>
                  ${UI.esc(a.city)}${a.state ? ', ' + UI.esc(a.state) : ''} — ${UI.esc(a.pincode)}<br>
                  <small class="dim">Phone: ${UI.esc(a.phone)}</small>
                </div>
              </div>
              <button class="btn-sv btn-ghost-sv" data-deladdr="${a._id}" style="padding:3px 9px;font-size:11px;color:var(--danger)">
                <i class="bi bi-trash"></i>
              </button>
            </div>`).join('')
        : '<p class="dim" style="font-size:var(--t-sm)">No saved addresses yet.</p>';

      host.querySelectorAll('[data-deladdr]').forEach((btn) =>
        btn.addEventListener('click', async () => {
          try {
            await SV.api.auth.deleteAddress(btn.dataset.deladdr);
            UI.toastOk('Address removed.');
            loadAddresses();
          } catch (err) { UI.toastErr(err); }
        })
      );
    } catch (err) {
      host.innerHTML = `<small class="dim">${UI.esc(err.message)}</small>`;
    }
  }

  document.getElementById('addrForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    try {
      await SV.api.auth.addAddress({
        fullName: document.getElementById('afName').value.trim(),
        phone: document.getElementById('afPhone').value.trim(),
        line1: document.getElementById('afLine1').value.trim(),
        line2: document.getElementById('afLine2').value.trim(),
        city: document.getElementById('afCity').value.trim(),
        state: document.getElementById('afState').value.trim(),
        pincode: document.getElementById('afPin').value.trim(),
      });
      UI.toastOk('Address saved.');
      e.target.reset();
      e.target.hidden = true;
      loadAddresses();
    } catch (err) {
      UI.toastErr(err);
      (err.errors || []).forEach((fe) => UI.toast(`${fe.field}: ${fe.message}`, 'error'));
    }
  });

  loadAddresses();

  /* -------------------------------- reviews ------------------------------ */

  if (user.role === 'customer') {
    document.getElementById('reviewsCard').hidden = false;
    try {
      const { data } = await SV.api.reviews.mine();
      document.getElementById('myReviews').innerHTML = data.length
        ? data.map((r) => `
            <div class="d-flex gap-2 align-items-start pb-3 mb-3" style="border-bottom:1px solid var(--line)">
              <img src="${UI.esc(r.product?.images?.[0] || '')}" alt="" style="width:44px;height:44px;object-fit:cover;border-radius:var(--r-sm)">
              <div class="flex-grow-1 min-w-0">
                <a href="product.html?id=${r.product?._id}" class="fw-semibold d-block text-truncate" style="font-size:var(--t-sm);color:var(--ink-900)">
                  ${UI.esc(r.product?.name || 'Product')}
                </a>
                ${UI.stars(r.rating)}
                <p class="muted mb-0" style="font-size:var(--t-xs)">${UI.esc(r.comment)}</p>
              </div>
              <button class="btn-sv btn-ghost-sv" data-delrev="${r._id}" style="padding:3px 9px;font-size:11px;color:var(--danger)">
                <i class="bi bi-trash"></i>
              </button>
            </div>`).join('')
        : '<p class="dim" style="font-size:var(--t-sm)">You have not reviewed anything yet.</p>';

      document.querySelectorAll('[data-delrev]').forEach((btn) =>
        btn.addEventListener('click', async () => {
          if (!confirm('Delete this review?')) return;
          try {
            await SV.api.reviews.remove(btn.dataset.delrev);
            UI.toastOk('Review deleted.');
            location.reload();
          } catch (err) { UI.toastErr(err); }
        })
      );
    } catch (_) { /* reviews panel is optional */ }
  }
})();
</script>
</body>
</html>
