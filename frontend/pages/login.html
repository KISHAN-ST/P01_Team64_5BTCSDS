<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login — ShopVerse</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@600;700;800&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="../assets/css/tokens.css" rel="stylesheet">
  <link href="../assets/css/main.css" rel="stylesheet">
  <style>
    .auth-split { min-height: 100vh; display: grid; grid-template-columns: 1fr 1fr; }
    .auth-form-side { display: grid; place-items: center; padding: var(--s-8); }
    .auth-brand-side {
      background: linear-gradient(150deg, var(--brand-900), var(--brand-700) 60%, var(--brand-500));
      color: #fff;
      display: grid;
      place-items: center;
      padding: var(--s-12);
      text-align: center;
      position: relative;
      overflow: hidden;
    }
    .auth-brand-side::after {
      content: "";
      position: absolute; inset: -40% -20% auto auto;
      width: 420px; height: 420px; border-radius: 50%;
      background: rgba(255,255,255,.06);
    }
    .auth-brand-side .inner { position: relative; z-index: 1; max-width: 34ch; }
    .auth-brand-side h2 { color: #fff; font-size: var(--t-2xl); margin: var(--s-4) 0 var(--s-3); }
    .auth-brand-side p { color: rgba(255,255,255,.78); font-size: var(--t-sm); }
    .auth-box { width: min(420px, 100%); }
    @media (max-width: 900px) { .auth-split { grid-template-columns: 1fr; } .auth-brand-side { display: none; } }
  </style>
</head>
<body>

<div class="auth-split">
  <!-- form -->
  <div class="auth-form-side">
    <div class="auth-box">
      <a href="../index.html" class="sv-logo text-brand mb-4 d-inline-flex" style="color:var(--brand-700)!important">
        <i class="bi bi-bag-heart-fill"></i> ShopVerse
      </a>

      <h1 style="font-size:var(--t-2xl)">Welcome back</h1>
      <p class="muted mb-4" style="font-size:var(--t-sm)">Log in to your account to continue shopping.</p>

      <form id="loginForm" novalidate>
        <div class="field">
          <label for="email">Email address</label>
          <input class="input" type="email" id="email" name="email" placeholder="you@example.com"
                 autocomplete="email" required>
          <span class="field-error" id="err-email" hidden></span>
        </div>

        <div class="field">
          <label for="password">Password</label>
          <div class="pw-wrap">
            <input class="input" type="password" id="password" name="password"
                   placeholder="Enter your password" autocomplete="current-password" required>
            <button class="pw-toggle" type="button" id="pwToggle" aria-label="Show password">
              <i class="bi bi-eye"></i>
            </button>
          </div>
          <span class="field-error" id="err-password" hidden></span>
        </div>

        <div class="d-flex justify-content-between align-items-center mb-4">
          <label class="check">
            <input type="checkbox" id="remember" checked> Remember me
          </label>
          <a href="#" style="font-size:var(--t-sm)" id="forgot">Forgot password?</a>
        </div>

        <button class="btn-sv btn-primary-sv btn-block" type="submit" id="submitBtn">Login</button>

        <p class="text-center muted mt-4 mb-0" style="font-size:var(--t-sm)">
          Don't have an account? <a href="register.html" class="fw-semibold">Sign up</a>
        </p>
      </form>

      <!-- Demo logins, so a reviewer can get in without reading the seed file. -->
      <div class="sv-card sv-card-pad mt-4" style="padding:var(--s-4)">
        <div class="d-flex justify-content-between align-items-center mb-2">
          <strong style="font-size:var(--t-xs)">DEMO ACCOUNTS</strong>
          <small class="dim">click to fill</small>
        </div>
        <div class="d-flex flex-wrap gap-2">
          <button class="chip" type="button" data-demo="customer1@gmail.com|Customer@12345">Customer</button>
          <button class="chip" type="button" data-demo="seller1@shopverse.com|Seller@12345">Seller</button>
          <button class="chip" type="button" data-demo="admin@shopverse.com|Admin@12345">Admin</button>
        </div>
      </div>
    </div>
  </div>

  <!-- brand panel -->
  <aside class="auth-brand-side">
    <div class="inner">
      <i class="bi bi-bag-heart-fill" style="font-size:44px"></i>
      <h2>Shop Smarter<br>Live Better</h2>
      <p>Join thousands of happy customers buying from verified sellers, with secure payments and hassle-free returns.</p>
    </div>
  </aside>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="../assets/js/api.js"></script>
<script src="../assets/js/ui.js"></script>
<script>
(function () {
  // Already signed in? Send them where they belong instead of showing the form.
  if (SV.isLoggedIn()) {
    location.replace(landingFor(SV.role()));
    return;
  }

  function landingFor(role) {
    if (role === 'seller') return 'seller.html';
    if (role === 'admin') return 'admin.html';
    return '../index.html';
  }

  const form = document.getElementById('loginForm');
  const btn = document.getElementById('submitBtn');

  document.getElementById('pwToggle').addEventListener('click', (e) => {
    const input = document.getElementById('password');
    const show = input.type === 'password';
    input.type = show ? 'text' : 'password';
    e.currentTarget.innerHTML = `<i class="bi bi-eye${show ? '-slash' : ''}"></i>`;
    e.currentTarget.setAttribute('aria-label', show ? 'Hide password' : 'Show password');
  });

  document.querySelectorAll('[data-demo]').forEach((chip) => {
    chip.addEventListener('click', () => {
      const [email, password] = chip.dataset.demo.split('|');
      form.email.value = email;
      form.password.value = password;
      UI.toast('Demo credentials filled. Press Login.', 'info', { duration: 2200 });
    });
  });

  document.getElementById('forgot').addEventListener('click', (e) => {
    e.preventDefault();
    UI.toast('Password reset is out of scope for this project. Use a demo account.', 'info');
  });

  const showError = (field, message) => {
    const el = document.getElementById(`err-${field}`);
    const input = document.getElementById(field);
    if (message) {
      el.textContent = message;
      el.hidden = false;
      input.classList.add('is-invalid');
    } else {
      el.hidden = true;
      input.classList.remove('is-invalid');
    }
  };

  // Validate on blur, not only on submit.
  form.email.addEventListener('blur', () =>
    showError('email', /^\S+@\S+\.\S+$/.test(form.email.value) ? '' : 'Enter a valid email address')
  );
  form.password.addEventListener('blur', () =>
    showError('password', form.password.value ? '' : 'Password is required')
  );

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    showError('email', '');
    showError('password', '');

    const email = form.email.value.trim();
    const password = form.password.value;
    let bad = false;

    if (!/^\S+@\S+\.\S+$/.test(email)) { showError('email', 'Enter a valid email address'); bad = true; }
    if (!password) { showError('password', 'Password is required'); bad = true; }
    if (bad) return;

    btn.disabled = true;
    btn.innerHTML = '<span class="spinner-border spinner-border-sm"></span> Signing in…';

    try {
      const res = await SV.api.auth.login({ email, password });
      SV.setSession(res.data.token, res.data.user);
      UI.toastOk(`Welcome back, ${res.data.user.name.split(' ')[0]}!`);

      const redirect = SV.store.get('sv_redirect');
      SV.store.remove('sv_redirect');
      setTimeout(() => {
        location.href = redirect || landingFor(res.data.user.role);
      }, 500);
    } catch (err) {
      UI.toastErr(err);
      showError('password', err.status === 401 ? 'Invalid email or password' : '');
      btn.disabled = false;
      btn.textContent = 'Login';
    }
  });
})();
</script>
</body>
</html>
